  if(boxes.length>=900)break;
  const sz=7+rnd()*6;
  if(Math.hypot(c[0],c[1])<10)continue;
  if(roadClear(c[0],c[1])<sz*0.75+1.5)continue;
  let ok=true;
  for(const b of boxes){if(Math.abs(c[0]-b.x)<b.hw+sz/2+1.5&&Math.abs(c[1]-b.z)<b.hw+sz/2+1.5){ok=false;break}}
  if(ok)boxes.push({x:c[0],z:c[1],hw:sz/2,h:3.2*(1+Math.floor(rnd()*4))});
}
const bgeo=new THREE.BoxGeometry(1,1,1);bgeo.translate(0,0.5,0);
const inst=new THREE.InstancedMesh(bgeo,new THREE.MeshLambertMaterial({color:0xffffff}),Math.max(1,boxes.length));
const mt=new THREE.Matrix4(),col=new THREE.Color();
boxes.forEach((b,i)=>{
  mt.makeScale(b.hw*2,b.h,b.hw*2);mt.setPosition(b.x,0,b.z);
  inst.setMatrixAt(i,mt);inst.setColorAt(i,col.setHex(pastel[Math.floor(rnd()*pastel.length)]));
});
inst.instanceMatrix.needsUpdate=true;if(inst.instanceColor)inst.instanceColor.needsUpdate=true;
scene.add(inst);
// आपके घर की लाल रोशनी
const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,60,12),new THREE.MeshBasicMaterial({color:0xff2233,transparent:true,opacity:0.55}));
beam.position.set(0,30,0);scene.add(beam);

// कार
const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.7,4.1),new THREE.MeshLambertMaterial({color:0xc62828}));body.position.y=0.65;car.add(body);
const cab=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,2.0),new THREE.MeshLambertMaterial({color:0x9fc9e8}));cab.position.set(0,1.28,-0.2);car.add(cab);
const wm=new THREE.MeshLambertMaterial({color:0x111111});
[[-1,1.3],[1,1.3],[-1,-1.3],[1,-1.3]].forEach(p=>{
  const w=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.3,14),wm);
  w.rotation.z=Math.PI/2;w.position.set(p[0]*0.95,0.38,p[1]);car.add(w);
});
scene.add(car);
const st={x:0,z:0,h:0,v:0};
(function(){let best=1e9;for(const q of segs){
  const dx=q[2]-q[0],dz=q[3]-q[1],L2=dx*dx+dz*dz;let t=L2?((0-q[0])*dx+(0-q[1])*dz)/L2:0;t=Math.max(0,Math.min(1,t));
  const px=q[0]+t*dx,pz=q[1]+t*dz,d=Math.hypot(px,pz);
  if(d<best){best=d;st.x=px;st.z=pz;st.h=Math.atan2(dx,dz)}}})();

// कंट्रोल
const k={l:0,r:0,g:0,b:0};
const map={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'g',w:'g',ArrowDown:'b',s:'b',' ':'b'};
addEventListener('keydown',e=>{const m=map[e.key];if(m){k[m]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const m=map[e.key];if(m)k[m]=0});
[['l','l'],['r','r'],['g','g'],['b','b']].forEach(([id,key])=>{
  const el=document.getElementById(id);
  const on=e=>{k[key]=1;el.classList.add('on');e.preventDefault()};
  const off=e=>{k[key]=0;el.classList.remove('on');e.preventDefault()};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
});

// मिनीमैप: ऊपर = उत्तर (North), दाएँ = पूर्व (East). छूने पर पूरा नक्शा खुलता है
const mm=document.getElementById('mm'),mx=mm.getContext('2d');let big=false,fc=0;
function sizeMM(){const W=big?Math.floor(Math.min(innerWidth,innerHeight)*0.92):150;mm.width=W;mm.height=W;mm.style.width=W+'px';mm.style.height=W+'px'}
mm.addEventListener('click',()=>{big=!big;mm.classList.toggle('big',big);sizeMM();drawMM()});
addEventListener('resize',sizeMM);sizeMM();
const TCOL=['#fbbf24','#fbbf24','#fde68a','#e5e7eb','#e5e7eb','#9ca3af','#a8896a'];
function drawMM(){
  const W=mm.width;mx.clearRect(0,0,W,W);
  let sc,cx0,cz0;
  if(big){const span=Math.max(bx1-bx0,bz1-bz0)+40;sc=W/span;cx0=(bx0+bx1)/2;cz0=(bz0+bz1)/2}
  else{sc=W/320;cx0=st.x;cz0=st.z}
  const X=x=>W/2-(x-cx0)*sc,Y=z=>W/2-(z-cz0)*sc;
  mx.lineCap='round';
  for(const q of segs){
    const ax=X(q[0]),ay=Y(q[1]),bx=X(q[2]),by=Y(q[3]);
    if(!big&&(ax<-20&&bx<-20||ax>W+20&&bx>W+20||ay<-20&&by<-20||ay>W+20&&by>W+20))continue;
    mx.strokeStyle=TCOL[q[5]];mx.lineWidth=Math.max(1.5,q[4]*2*sc);
    mx.beginPath();mx.moveTo(ax,ay);mx.lineTo(bx,by);mx.stroke();
  }
  mx.fillStyle='#ef4444';mx.beginPath();mx.arc(X(0),Y(0),big?6:4,0,7);mx.fill();
  mx.fillStyle='#fff';mx.font='bold '+(big?16:11)+'px sans-serif';mx.fillText('घर',X(0)+7,Y(0)-6);
  const px=X(st.x),py=Y(st.z),fx=-Math.sin(st.h),fy=-Math.cos(st.h),r=big?9:7;
  mx.fillStyle='#22c55e';mx.strokeStyle='#fff';mx.lineWidth=2;mx.beginPath();
  mx.moveTo(px+fx*r*1.4,py+fy*r*1.4);mx.lineTo(px-fx*r-fy*r*.8,py-fy*r+fx*r*.8);mx.lineTo(px-fx*r+fy*r*.8,py-fy*r-fx*r*.8);
  mx.closePath();mx.fill();mx.stroke();
  mx.fillStyle='#fff';mx.font='bold 13px sans-serif';mx.fillText('N ↑',W-30,16);
}
// फुलस्क्रीन + लैंडस्केप
document.getElementById('fs').addEventListener('click',async()=>{
  try{
    const d=document.documentElement;
    if(!document.fullscreenElement&&d.requestFullscreen)await d.requestFullscreen();
    if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');
  }catch(e){}
});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// गेम लूप
const spd=document.getElementById('speed');
let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-last)/1000,0.05);last=t;
  let acc=0;
  if(k.g)acc=16;
  if(k.b)acc=st.v>0.5?-32:-10;
  st.v+=acc*dt;
  st.v-=st.v*0.6*dt;
  st.v=Math.max(-8,Math.min(30,st.v));
  const steer=(k.l-k.r);
  st.h+=steer*dt*1.7*Math.max(-1,Math.min(1,st.v/9));
  st.x+=Math.sin(st.h)*st.v*dt;
  st.z+=Math.cos(st.h)*st.v*dt;
  // टक्कर
  for(const b of boxes){
    const dx=st.x-b.x,dz=st.z-b.z,R=1.5;
    const px=Math.max(-b.hw,Math.min(b.hw,dx)),pz=Math.max(-b.hw,Math.min(b.hw,dz));
    const ox=dx-px,oz=dz-pz,d=Math.hypot(ox,oz);
    if(d<R){
      if(d>0.0001){st.x+=ox/d*(R-d);st.z+=oz/d*(R-d)}
      else st.x+=R;
      st.v*=0.4;
    }
  }
  st.x=Math.max(bx0-30,Math.min(bx1+30,st.x));st.z=Math.max(bz0-30,Math.min(bz1+30,st.z));
  car.position.set(st.x,0,st.z);car.rotation.y=st.h;
  const tx=st.x-Math.sin(st.h)*9,tz=st.z-Math.cos(st.h)*9;
  cam.position.x+=(tx-cam.position.x)*Math.min(1,dt*5);
  cam.position.z+=(tz-cam.position.z)*Math.min(1,dt*5);
  cam.position.y=4.8;
  cam.lookAt(st.x+Math.sin(st.h)*4,1.2,st.z+Math.cos(st.h)*4);
  spd.textContent=Math.round(Math.abs(st.v)*3.6)+' km/h';
  if((fc++%3)===0)drawMM();
  ren.render(scene,cam);
}
cam.position.set(st.x-Math.sin(st.h)*9,4.8,st.z-Math.cos(st.h)*9);
requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script>
